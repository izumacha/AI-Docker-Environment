name: Post-CI Verification

# Runs after the "CI" workflow finishes. When CI succeeded on a pull request,
# a Claude Code agent verifies/summarizes the type-check + e2e results and posts
# a concise summary comment on the PR. workflow_run only fires for this file once
# it lives on the default branch (main).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read
  # The Claude GitHub App auth path (no github_token input passed below) needs
  # `id-token: write` for its OIDC token exchange; without it the verify step
  # fails to authenticate.
  id-token: write

jobs:
  verify:
    name: Claude verifies CI results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    env:
      # The secrets context cannot be used in the job-level `if:`, so surface
      # the presence of CLAUDE_CODE_OAUTH_TOKEN once as a job env var and gate
      # every step on it consistently. Without the secret the Claude step
      # cannot authenticate (FR-9.3) and used to fail the whole run; skipping
      # instead keeps the workflow green until the secret is registered
      # (FR-9.3.1).
      CLAUDE_OAUTH_TOKEN_AVAILABLE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Notice when CLAUDE_CODE_OAUTH_TOKEN is missing
        if: env.CLAUDE_OAUTH_TOKEN_AVAILABLE != 'true'
        run: >-
          echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret is not configured;
          skipping Claude verification (FR-9.3). Register the secret to enable
          the PR summary comment."

      - name: Resolve PR number
        id: pr
        if: env.CLAUDE_OAUTH_TOKEN_AVAILABLE == 'true'
        # SHA-pinned on the same terms as the claude-code-action step below
        # (FR-9.6(b)); test/action_pin_test.sh checks this marker too.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            let number = run.pull_requests?.[0]?.number;
            // Fallback only for same-repo runs: a fork could pick a branch name
            // matching an open same-repo branch and hijack the comment target.
            const sameRepo = run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!number && sameRepo) {
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${run.head_branch}`,
              });
              // Multiple open PRs can share a head branch (e.g. the same branch
              // opened against different bases), so match the exact commit CI
              // ran on rather than blindly taking the first result.
              const match = prs.data.find((pr) => pr.head.sha === run.head_sha);
              number = match ? match.number : '';
            }
            core.setOutput('number', number || '');

      # Intentionally do NOT check out the PR head: this is a privileged
      # workflow_run job (pull-requests: write + CLAUDE_CODE_OAUTH_TOKEN), so
      # untrusted PR content must not enter the workspace. The agent only reads
      # CI results and comments, both via gh.
      - name: Claude verifies and comments
        if: env.CLAUDE_OAUTH_TOKEN_AVAILABLE == 'true' && steps.pr.outputs.number != ''
        # Pinned to a full commit SHA (not the mutable v1 tag) to avoid a
        # supply-chain risk in this privileged job. The trailing `# vX.Y.Z`
        # marker is the source of truth for which release that SHA is, and
        # test/action_pin_test.sh asserts in CI that the two still agree, so
        # neither can drift unnoticed. Bump deliberately; never check a pin
        # against `v1`, which moves with every release and so resolves to a
        # different commit than the pin. Procedure: FR-9.6(b) of
        # docs/requirements.md.
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f # v1.0.198
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action overwrites GH_TOKEN with the Claude App token, whose
          # default scopes do not include Actions read. `gh run view` needs it
          # (required for private repos), so request it explicitly.
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 6
            --allowedTools "Bash(gh run view:*),Bash(gh pr comment:*)"
          prompt: |
            The "CI" workflow (type-check + e2e) succeeded for PR #${{ steps.pr.outputs.number }} in ${{ github.repository }}.

            Do the following, then stop:
            1. Inspect the CI run: `gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}` (add `--log-failed` or `--log` only if you need detail).
            2. Briefly verify and summarize the type-check and e2e results (acceptance criteria AC-1..AC-4 / AC-7).
            3. Post exactly ONE concise verification summary as a PR comment:
               `gh pr comment ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --body "<summary>"`
               Keep it short: overall pass/fail and a few key points. Do NOT commit or modify any files, and do NOT push.
